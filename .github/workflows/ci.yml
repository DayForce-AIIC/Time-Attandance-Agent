name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Lint backend
        run: ruff check backend

      - name: Check backend formatting
        run: ruff format --check backend

      - name: Type-check backend
        run: mypy backend/app

      - name: Test backend
        working-directory: backend
        env:
          PYTHONPATH: .
        # Keep the strict coverage floor on the deterministic business-rule core.
        # External-service adapters and worker orchestration need separate integration coverage.
        run: pytest --cov=app.engine --cov=app.validator --cov=app.pipeline --cov=app.decisions --cov=app.audit --cov=app.detection --cov=app.repo --cov=app.seed --cov-fail-under=85

      - name: Check OpenAPI is synchronized
        run: |
          cd backend
          PYTHONPATH=. python scripts/export_openapi.py
          cd ..
          git diff --exit-code -- docs/openapi.json

  eval:
    name: Evaluation and safety gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install evaluation dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Check evaluation cases are synchronized
        run: |
          python eval/generate_cases.py
          git diff --exit-code -- eval/cases.jsonl

      - name: Run mock-provider evaluation
        env:
          LLM_PROVIDER: mock
        run: python eval/run_eval.py

      - name: Add evaluation results to job summary
        if: always()
        run: cat eval/results.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shiftguard-evaluation-results
          path: eval/results.md
          if-no-files-found: error

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check generated API types are synchronized
        working-directory: frontend
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/openapi-types.ts

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build
